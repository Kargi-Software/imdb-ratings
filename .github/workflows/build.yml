name: Build IMDB
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          curl -L https://datasets.imdbws.com/title.episode.tsv.gz | gunzip > episode.tsv
          curl -L https://datasets.imdbws.com/title.ratings.tsv.gz | gunzip > ratings.tsv
          python3 << 'PY'
          import csv, os, json
          from collections import defaultdict
          ratings={}
          with open('ratings.tsv') as f:
              for row in csv.DictReader(f, delimiter='\t'):
                  try: ratings[row['tconst']]=float(row['averageRating'])
                  except: pass
          grouped=defaultdict(list)
          with open('episode.tsv') as f:
              for row in csv.DictReader(f, delimiter='\t'):
                  if row['tconst'] not in ratings: continue
                  if not row['seasonNumber'].isdigit(): continue
                  if not row['episodeNumber'].isdigit(): continue
                  grouped[row['parentTconst']].append({'s':int(row['seasonNumber']),'e':int(row['episodeNumber']),'r':ratings[row['tconst']]})
          os.makedirs('ratings_out', exist_ok=True)
          c=0
          for pid, eps in grouped.items():
              if len(eps) >= 5:
                  eps.sort(key=lambda x:(x['s'],x['e']))
                  open(f'ratings_out/{pid}.json','w').write(json.dumps(eps))
                  c+=1
          print(f"saved {c}")
          PY

      - name: Deploy
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git checkout --orphan gh-pages
          rm -rf episode.tsv ratings.tsv .github
          mkdir -p ratings
          cp ratings_out/*.json ratings/
          git add ratings
          git commit -m "update"
          git push -f origin gh-pages
