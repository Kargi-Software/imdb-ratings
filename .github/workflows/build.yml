name: Build IMDB
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download datasets
        run: |
          curl -L https://datasets.imdbws.com/title.episode.tsv.gz -o episode.tsv.gz
          curl -L https://datasets.imdbws.com/title.ratings.tsv.gz -o ratings.tsv.gz
          gunzip -f episode.tsv.gz
          gunzip -f ratings.tsv.gz
          ls -lh

      - name: Build JSON files
        run: |
          python3 << 'PY'
          import csv, os, json
          from collections import defaultdict
          ratings = {}
          with open('ratings.tsv', encoding='utf-8') as f:
              reader = csv.DictReader(f, delimiter='\t')
              for row in reader:
                  try:
                      ratings[row['tconst']] = float(row['averageRating'])
                  except:
                      pass
          print(f"Loaded {len(ratings)} ratings")
          grouped = defaultdict(list)
          with open('episode.tsv', encoding='utf-8') as f:
              reader = csv.DictReader(f, delimiter='\t')
              for row in reader:
                  if row['tconst'] not in ratings:
                      continue
                  if not row['seasonNumber'].isdigit():
                      continue
                  if not row['episodeNumber'].isdigit():
                      continue
                  pid = row['parentTconst']
                  grouped[pid].append({
                      's': int(row['seasonNumber']),
                      'e': int(row['episodeNumber']),
                      'r': ratings[row['tconst']]
                  })
          os.makedirs('ratings', exist_ok=True)
          saved = 0
          for pid, eps in grouped.items():
              if len(eps) >= 5:
                  eps.sort(key=lambda x: (x['s'], x['e']))
                  with open(f'ratings/{pid}.json', 'w') as out:
                      out.write(json.dumps(eps))
                  saved += 1
          print(f"Saved {saved} series")
          PY

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan gh-pages
          git rm -rf. || true
          mkdir ratings
          mv /home/runner/work/imdb-cache/imdb-cache/ratings/*.json ratings/ 2>/dev/null || mv ratings/ratings/*.json ratings/ || true
          ls ratings | head
          git add ratings
          git commit -m "update cache" || echo "nothing to commit"
          git push -f origin gh-pages
