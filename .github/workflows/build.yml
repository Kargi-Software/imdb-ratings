name: Build IMDB
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Build
        run: |
          curl -L https://datasets.imdbws.com/title.episode.tsv.gz | gunzip > episode.tsv
          curl -L https://datasets.imdbws.com/title.ratings.tsv.gz | gunzip > ratings.tsv
          python3 << 'PY'
          import csv, os, json
          from collections import defaultdict
          ratings={}
          with open('ratings.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  try: ratings[r['tconst']]=float(r['averageRating'])
                  except: pass
          print(f"ratings count: {len(ratings)}")
          grouped=defaultdict(list)
          with open('episode.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  if r['tconst'] not in ratings: continue
                  if not r['seasonNumber'].isdigit(): continue
                  if not r['episodeNumber'].isdigit(): continue
                  grouped[r['parentTconst']].append({'s':int(r['seasonNumber']),'e':int(r['episodeNumber']),'r':ratings[r['tconst']]})
          os.makedirs('ratings', exist_ok=True)
          c=0
          for pid, eps in grouped.items():
              if len(eps) >= 5:
                  eps.sort(key=lambda x:(x['s'],x['e']))
                  open(f'ratings/{pid}.json','w').write(json.dumps(eps))
                  c+=1
          print(f"SAVED_SERIES: {c}")
          print(f"EXAMPLE: {list(grouped.keys())[:3]}")
          PY
          ls ratings | wc -l
          ls ratings | head -5
          - name: Push to gh-pages
            run: |
              cp -r ratings /tmp/ratings
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git checkout --orphan gh-pages
              git rm -rf . 2>/dev/null || true
              mkdir -p ratings
              cp /tmp/ratings/*.json ratings/
              ls ratings | wc -l
              git add ratings
              git commit -m "fix flat structure"
              git push -f origin gh-pages
